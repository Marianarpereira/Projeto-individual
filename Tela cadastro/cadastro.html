<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styleCad.css">
    <link rel="stylesheet" href="">
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Criar conta</h2>
        </div>

        <form class="form" id="form">

            <div class="form-control">
                <label for="username">Nome</label>
                <input type="text" id="username">
                <i> <img class="img-success" src="success-icon.svg" alt=""></i>
                <i> <img class="img-error" src="error-icon.svg" alt="" ></i>

                <small>Error menssage</small>
            </div>

              <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email">
                <i> <img class="img-success"  src="success-icon.svg" alt=""></i>
                <i> <img class="img-error" src="error-icon.svg" alt=""></i>

                <small>Error menssage</small>
            </div>

              <div class="form-control">
                <label for="password">Senha</label>
                <input type="password" id="password">
                <i> <img class="img-success" src="success-icon.svg" alt=""></i>
                <i> <img class="img-error" src="error-icon.svg" alt=""></i>

                <small>Error menssage</small>
            </div>

              <div class="form-control">
                <label for="confirm-password">Confirme a sua senha</label>
                <input type="password" id="confirmPassword">
                <i> <img class="img-success" src="success-icon.svg" alt=""></i>
                <i> <img class="img-error" src="error-icon.svg" alt=""></i>

                <small>Error menssage</small>
            </div>

            <button type="submit">ENVIAR</button>

        </form>

    </div>

    <script src="index.js"></script>


   

</body>
</html>
