<div class="container-quizzes">

    <button class="card-quiz" onclick="selecionarQuiz('quiz1')">

            <h2>UNIVERSO RESIDENT EVIL 4</h2>

        </div>
    </button>

    <button class="card-quiz" onclick="selecionarQuiz('quiz2')">

        </div>
    </button>

            <p>Conheça os inimigos, suas características e as ameaças que Leon enfrenta.</p>
        </div>
    </button>

    <button class="card-quiz" onclick="selecionarQuiz('quiz4')">
