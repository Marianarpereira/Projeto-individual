<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./assets/icon/umbrella.png">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
    <title>Resident Evil 4</title>
  </head>
  <body>

<main class="login-layout">
          <section class="container">
        <div class="container">
            <div class="header">
                <h2>ENTRAR</h2>
            </div>
            <p id="mensagemCadastro" class="mensagem-cadastro" hidden></p>

      <form class="form" id="form">

    <div class="form-control">
        <label for="usuario">Email</label>
        <input type="text" id="usuario" class="form-control">
    </div>

    <div class="form-control">
        <label for="senha">Senha</label>
        <input type="password" id="senha" class="form-control">
    </div>

    <button type="button" class="btn btn-sucess form-control" onclick="logar()">
        Logar
    </button>

</form>
    </div>
  </section>

  
  <div class="imagem-lateral">
    <img
    src="https://i.pinimg.com/736x/fc/e5/0e/fce50e096997e50ebb205f57906892a9.jpg"
    alt="Resident Evil 4"
    >
  </div>
</main>

    <script src="./js/login.js"></script>
  </body>
</html>
