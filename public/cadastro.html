<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/png" href="./assets/icon/umbrella.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@200..800&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@200..800&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/styleCad.css">
    <link rel="stylesheet" href="">
</head>

<body>
    <main class="cadastro-layout">
        <section class="container">
            <div class="container">
                <div class="header">
                    <h2>Criar conta</h2>
                    <h4>Já tem cadastro? <a href="./login.html">Login</a></h4>
                </div>

                <form class="form" id="form">

                    <div class="form-control">
                        <label for="username">Nome de usuário</label>
                        <input type="text" id="username">
                        <i> <img class="img-success" src="./assets/success-icon.svg" alt=""></i>
                        <i> <img class="img-error" src="./assets/error-icon.svg" alt=""></i>


                        <small>Error menssage</small>


                    </div>

                    <div class="form-control">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                        <i> <img class="img-success" src="./assets/success-icon.svg" alt=""></i>
                        <i> <img class="img-error" src="./assets/error-icon.svg" alt=""></i>

                        <small>Error menssage</small>
                    </div>

                    <div class="form-control">
                        <label for="password">Senha</label>
                        <input onkeyup="ChkSenha()" type="password" id="password">
                        <i> <img class="img-success" src="./assets/success-icon.svg" alt=""></i>
                        <i> <img class="img-error" src="./assets/error-icon.svg" alt=""></i>

                        <label id="verificacao"></label>

                        <label id="ruleLength">Pelo menos 8 caracteres.</label> <br>

                        <label id="uppercase">Contém letras maiúsculas.</label> <br>

                        <label id="lowercase">Contém letras minúsculas.</label> <br>

                        <label id="numbers">Contém números.</label> <br>

                        <label id="special">Contém caracteres especiais
                            Ex: ("@","!","*", "#")</label>


                        <i><img class="img-success" src="./assets/success-icon.svg" alt=""></i>
                        <i><img class="img-error" src="./assets/error-icon.svg" alt=""></i>


                        </label>
                    </div>

                    <div class="form-control">
                        <label for="confirm-password">Confirme a sua senha</label>
                        <input onkeyup="ChkSenha()" type="password" id="confirmPassword">
                        <i> <img class="img-success" src="./assets/success-icon.svg" alt=""></i>
                        <i> <img class="img-error" src="./assets/error-icon.svg" alt=""></i>

                        <small>Error menssage</small>
                    </div>

                    <button class="button" type="submit">ENVIAR</button>

                </form>

            </div>
        </section>

        <div class="imagem-lateral">
            <img src="https://i.pinimg.com/1200x/4d/fc/70/4dfc70c2b1ad73e66b5f4b4493af04f2.jpg" alt="Resident Evil 4">
        </div>
    </main>

    <script src="./js/cadastro.js"></script>




</body>

</html>
